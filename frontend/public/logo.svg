<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background shield shape with glow -->
  <path d="M24 4 L6 11 C6 23 12 35 24 44 C36 35 42 23 42 11 Z" fill="url(#shield-grad)" opacity="0.15" filter="url(#glow)" />
  <!-- Outer Shield Border -->
  <path d="M24 4 L6 11 C6 23 12 35 24 44 C36 35 42 23 42 11 Z" stroke="url(#shield-grad)" stroke-width="3" stroke-linejoin="round" />
  <!-- Inner Shield Core -->
  <path d="M24 9 L11 14 C11 23 15 32 24 39 C33 32 37 23 37 14 Z" fill="url(#shield-grad)" />
  <!-- Accent Tech Line -->
  <path d="M24 14 V34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>
